<!doctype html>
<html lang="cs">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Jsme firma specializovaná na servis motorů pro ultralehká letadla. Provádíme záruční a pozáruční servis motorů Zonsen aero engine.">
		<meta name="robots" content="index, follow">

		<title>Nabídka služeb | Flyservis Vrchlabí - Váš partner pro bezstarostné lety</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="./src/css/bootstrap.min.css">
		<link rel="stylesheet" href="./src/css/font.css">
		<link href="./src/css/style.css?v=1" rel="stylesheet">

		<link rel="icon" href="./src/img/favicon.ico">
	</head>

	<body>
		<header>
			<div class="hero hero--small position-relative">
				<img src="./src/img/hero.jpg" alt="Flyservis Vrchlabí" class="hero__img">

				<div class="container position-absolute top-0 start-0 text-end mt-3">
					<ul class="main-menu">
						<li class="menu-item">
							<a href="https://fly-servis.cz/" class="menu-link">Úvod</a>
						</li>
						<li class="menu-item">
							<a href="https://fly-servis.cz/nabidka-sluzeb" class="menu-link is-active">Nabídka služeb</a>
						</li>
					</ul>
				</div>

				<div class="container position-absolute top-50 start-0">
					<h1 class="hero__heading color-white text-end">Flyservis s.r.o.</h1>
				</div>
			</div>
		</header>
		<main>
			<section aria-label="Nabídka služeb">
				<div class="about-us text-center mt-5 mb-5">
					<div class="container">
						<div class="row">
							<div class="col col-12">
								<h2 class="mb-5">Nabídka služeb</h2>
								<div class="pdf-grid" id="pdf-grid"></div>
							</div>
						</div>
					</div>
				</div>
			</section>
		</main>

		<script>
		fetch("https://opensheet.elk.sh/1KNRRtRDdsnpVh2WWxNrr49HXw3gy7kbkXpoIR6qyG44/odkazyPDF")
		  .then(res => res.json())
		  .then(data => {
			const container = document.getElementById("pdf-grid");

			data.forEach(item => {
			  if (!item.odkaz_na_pdf) return;

			  const match = item.odkaz_na_pdf.match(/\/d\/(.*?)\//);
			  if (!match) return;

			  const fileId = match[1];
			  const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
			  const openUrl = `https://drive.google.com/file/d/${fileId}/view`;

			  const card = document.createElement("div");
			  card.className = "pdf-card";

			  card.innerHTML = `
				  <h3>${item.nazev}</h3>
				  <div class="pdf-content">
				    <div class="pdf-preview-wrapper">
				      <iframe src="${previewUrl}" loading="lazy"></iframe>
				    </div>
				    <a href="${openUrl}" target="_blank" rel="noopener">
				      Otevřít PDF
				    </a>
				  </div>
				`;

			  container.appendChild(card);
			});
		  });
		</script>

	</body>
</html>
